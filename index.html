<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Club Queue</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Crimson Text', Georgia, serif;
      background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
      min-height: 100vh;
      color: #fff;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 100px;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 400;
      background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    
    .user-select {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    
    .user-select h1 {
      font-size: 32px;
      margin-bottom: 32px;
    }
    
    .user-button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      padding: 20px;
      font-size: 20px;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      max-width: 300px;
      margin: 8px 0;
      transition: all 0.3s ease;
    }
    
    .user-button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
    
    .tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
      margin-top: 16px;
    }
    
    .tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    
    .tab.active {
      background: rgba(255, 216, 155, 0.2);
      border-color: rgba(255, 216, 155, 0.3);
      color: #ffd89b;
    }
    
    .book-list {
      padding: 20px;
    }
    
    .book-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .book-card.readonly {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.05);
    }
    
    .book-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    
    .book-title a {
      color: #ffd89b;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 216, 155, 0.3);
    }
    
    .book-title a:hover {
      border-bottom-color: #ffd89b;
    }
    
    .genre-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    select, input {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 12px;
    }
    
    select {
      cursor: pointer;
    }
    
    .timing-display {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
    }
    
    .delete-btn {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    
    .delete-btn:hover {
      background: rgba(220, 38, 38, 0.3);
    }
    
    .add-button {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
      border: none;
      color: #1a0b2e;
      padding: 16px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      font-family: inherit;
    }
    
    .add-button:hover {
      transform: translate(-50%, -2px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: linear-gradient(135deg, #2d1b4e 0%, #1a0b2e 100%);
      border-radius: 24px 24px 0 0;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: none;
    }
    
    .modal h2 {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 400;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }
    
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      border: none;
    }
    
    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
      color: #1a0b2e;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.4);
    }
    
    .section-title {
      margin: 0 0 16px 0;
      font-size: 20px;
      font-weight: 600;
    }
    
    .section-title.primary {
      color: #ffd89b;
    }
    
    .section-title.secondary {
      color: rgba(255, 255, 255, 0.6);
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- User Selection Screen -->
  <div id="userSelectScreen" class="user-select">
    <div style="font-size: 48px; margin-bottom: 16px;">📚</div>
    <h1 style="background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Book Club Queue</h1>
    <p style="color: rgba(255, 255, 255, 0.6); margin-bottom: 32px;">Who are you?</p>
    <button class="user-button" onclick="selectUser('Dan')">Dan</button>
    <button class="user-button" onclick="selectUser('Lucy')">Lucy</button>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden">
    <div class="header">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
        <div>
          <h1>Book Club Queue</h1>
          <p style="color: rgba(255, 255, 255, 0.5); font-size: 13px;" id="userLabel"></p>
        </div>
        <button onclick="switchUser()" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: rgba(255, 255, 255, 0.7); padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: inherit;">
          Switch
        </button>
      </div>
      
      <div class="tabs">
        <button class="tab active" onclick="switchView('my')" id="tabMy">My Queue (0)</button>
        <button class="tab" onclick="switchView('their')" id="tabTheir">Other (0)</button>
        <button class="tab" onclick="switchView('both')" id="tabBoth">Both</button>
      </div>
    </div>

    <div class="book-list">
      <div id="myView">
        <div id="myBooks"></div>
      </div>
      
      <div id="theirView" class="hidden">
        <div id="theirBooks"></div>
      </div>
      
      <div id="bothView" class="hidden">
        <h2 class="section-title primary" id="myQueueTitle"></h2>
        <div id="myBooksBoth"></div>
        
        <div style="margin-top: 32px;">
          <h2 class="section-title secondary" id="theirQueueTitle"></h2>
          <div id="theirBooksBoth"></div>
        </div>
      </div>
    </div>

    <button class="add-button" onclick="showAddForm()" id="addButton">+ Add Book</button>
  </div>

  <!-- Add Book Modal -->
  <div id="addModal" class="modal hidden" onclick="hideAddForm()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2>Add New Book</h2>
      
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="inputTitle" placeholder="Enter book title">
      </div>
      
      <div class="form-group">
        <label>Goodreads Link</label>
        <input type="url" id="inputLink" placeholder="https://www.goodreads.com/book/show/...">
      </div>
      
      <div class="form-group">
        <label>Genre *</label>
        <select id="inputGenre">
          <option value="">Select a genre</option>
          <option>Fantasy</option>
          <option>Fiction</option>
          <option>Historical Fiction</option>
          <option>Horror</option>
          <option>Memoir</option>
          <option>Mystery</option>
          <option>Non-Fiction</option>
          <option>Poetry</option>
          <option>Romance</option>
          <option>Science Fiction</option>
          <option>Sports</option>
          <option>Thriller</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>When to Read</label>
        <select id="inputTiming">
          <option value="1">📖 Reading Now</option>
          <option value="2">📅 Starting < 30 Days</option>
          <option value="3">🗓️ Starting > 30 Days</option>
          <option value="4" selected>📚 To Read (Someday)</option>
        </select>
      </div>
      
      <div class="button-row">
        <button class="btn btn-cancel" onclick="hideAddForm()">Cancel</button>
        <button class="btn btn-primary" onclick="addBook()">Add Book</button>
      </div>
    </div>
  </div>

    // Initialize on page load
    initializeBooks();
    
    function selectUser(user) {
      currentUser = user;
      document.getElementById('userSelectScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('userLabel').textContent = user + "'s view";
      updateTabLabels();
      renderBooks();
    }
    
    function switchUser() {
      if (confirm('Switch user?')) {
        currentUser = null;
        document.getElementById('userSelectScreen').classList.remove('hidden');
        document.getElementById('mainApp').classList.add('hidden');
      }
    }
    
    function switchView(view) {
      currentView = view;
      
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.getElementById('tab' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('active');
      
      document.getElementById('myView').classList.add('hidden');
      document.getElementById('theirView').classList.add('hidden');
      document.getElementById('bothView').classList.add('hidden');
      document.getElementById('addButton').classList.add('hidden');
      
      if (view === 'my') {
        document.getElementById('myView').classList.remove('hidden');
        document.getElementById('addButton').classList.remove('hidden');
      } else if (view === 'their') {
        document.getElementById('theirView').classList.remove('hidden');
      } else {
        document.getElementById('bothView').classList.remove('hidden');
      }
    }
    
    function getBooks(user) {
      const data = localStorage.getItem('book-queue-' + user);
      return data ? JSON.parse(data) : [];
    }
    
    function saveBooks(user, books) {
      localStorage.setItem('book-queue-' + user, JSON.stringify(books));
    }
    
    function updateTabLabels() {
      const myBooks = getBooks(currentUser);
      const otherUser = currentUser === 'Dan' ? 'Lucy' : 'Dan';
      const theirBooks = getBooks(otherUser);
      
      document.getElementById('tabMy').textContent = 'My Queue (' + myBooks.length + ')';
      document.getElementById('tabTheir').textContent = otherUser + "'s (" + theirBooks.length + ')';
      document.getElementById('myQueueTitle').textContent = currentUser + "'s Queue";
      document.getElementById('theirQueueTitle').textContent = otherUser + "'s Queue";
    }
    
    function sortBooks(books) {
      return books.sort((a, b) => {
        if (a.timing !== b.timing) {
          return a.timing.localeCompare(b.timing);
        }
        return new Date(a.addedDate) - new Date(b.addedDate);
      });
    }
    
    function renderBookList(books, canEdit, containerId) {
      const container = document.getElementById(containerId);
      
      if (books.length === 0) {
        container.innerHTML = '<div class="empty-state"><div style="font-size: 48px; margin-bottom: 16px;">📚</div><p style="font-size: 18px;">Queue is empty</p></div>';
        return;
      }
      
      const sorted = sortBooks([...books]);
      container.innerHTML = sorted.map(book => `
        <div class="book-card ${canEdit ? '' : 'readonly'}">
          <div class="book-title">
            ${book.goodreadsLink ? 
              '<a href="' + book.goodreadsLink + '" target="_blank">' + book.title + '</a>' : 
              book.title
            }
          </div>
          <div class="genre-badge">${book.genre}</div>
          ${canEdit ? `
            <select onchange="updateTiming('${book.id}', this.value)">
              <option value="1" ${book.timing === '1' ? 'selected' : ''}>📖 Reading Now</option>
              <option value="2" ${book.timing === '2' ? 'selected' : ''}>📅 Starting < 30 Days</option>
              <option value="3" ${book.timing === '3' ? 'selected' : ''}>🗓️ Starting > 30 Days</option>
              <option value="4" ${book.timing === '4' ? 'selected' : ''}>📚 To Read (Someday)</option>
            </select>
            <button class="delete-btn" onclick="deleteBook('${book.id}')">🗑 Remove</button>
          ` : `
            <div class="timing-display">${TIMING_LABELS[book.timing]}</div>
          `}
        </div>
      `).join('');
    }
    
    function renderBooks() {
      const myBooks = getBooks(currentUser);
      const otherUser = currentUser === 'Dan' ? 'Lucy' : 'Dan';
      const theirBooks = getBooks(otherUser);
      
      renderBookList(myBooks, true, 'myBooks');
      renderBookList(theirBooks, false, 'theirBooks');
      renderBookList(myBooks, true, 'myBooksBoth');
      renderBookList(theirBooks, false, 'theirBooksBoth');
      
      updateTabLabels();
    }
    
    function showAddForm() {
      document.getElementById('addModal').classList.remove('hidden');
    }
    
    function hideAddForm() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputLink').value = '';
      document.getElementById('inputGenre').value = '';
      document.getElementById('inputTiming').value = '4';
    }
    
    function addBook() {
      const title = document.getElementById('inputTitle').value;
      const link = document.getElementById('inputLink').value;
      const genre = document.getElementById('inputGenre').value;
      const timing = document.getElementById('inputTiming').value;
      
      if (!title || !genre) {
        alert('Please fill in title and genre');
        return;
      }
      
      const books = getBooks(currentUser);
      books.push({
        id: Date.now().toString(),
        title: title,
        goodreadsLink: link,
        genre: genre,
        timing: timing,
        addedDate: new Date().toISOString()
      });
      
      saveBooks(currentUser, books);
      hideAddForm();
      renderBooks();
    }
    
    function deleteBook(id) {
      if (!confirm('Remove this book from queue?')) return;
      
      const books = getBooks(currentUser);
      const updated = books.filter(b => b.id !== id);
      saveBooks(currentUser, updated);
      renderBooks();
    }
    
    function updateTiming(id, timing) {
      const books = getBooks(currentUser);
      const updated = books.map(b => b.id === id ? {...b, timing: timing} : b);
      saveBooks(currentUser, updated);
      renderBooks();
    }
  </script>
